# Keyless assembled-app coverage for one complete Graph Mode run. The fixture
# activates the default software-engineering team after the pre-created agent
# exists, then fences the parent's second step until the graph completion
# message has entered its inbox.

- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
            config:
              providers:
                - id: deepseek-official
                  name: DeepSeek replay
                  models:
                    - id: deepseek-v4-flash
                      contextWindow: 128000
                      defaultMaxTokens: 16384
          - id: graph
            name: '@deepseek-ai/dsh-graph'
          - id: graph-worker
            name: '@deepseek-ai/dsh-graph-worker'
          - id: graph-worker-local
            name: '@deepseek-ai/dsh-graph-worker-local'
            config:
              providerName: local
              subagentProvider: spawn
          - id: graph-resources
            name: '@deepseek-ai/dsh-graph-resources'
          - id: graph-resources-sqlite
            name: '@deepseek-ai/dsh-graph-resources-sqlite'
            config:
              providerName: sqlite-resources
              path: .sessions/graph-resources.snapshot.sqlite
              routes:
                - provider: deepseek-official
                  model: deepseek-v4-flash
                  concurrencyLimit: 1
          - id: graph-mode
            name: '@deepseek-ai/dsh-graph-mode'
            config:
              workerProvider: local
              workspaceMode: shared
              resourceProvider: sqlite-resources

- id: graph-snapshot-fixture
  name: './tests/fixtures/graph-snapshot-fixture.ts'
